        - https://ide-tech.com/wp-content/uploads/2023/01/SOREK-II-2022-.pdf
      capacity: https://ide-tech.com/wp-content/uploads/2023/01/Sorek-I-Desalination-Plant-Overview.pdf
      status: https://ide-tech.com/wp-content/uploads/2023/01/Sorek-I-Desalination-Plant-Overview.pdf

