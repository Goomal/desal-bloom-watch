      - [31.860, 34.656]
      - [31.860, 34.632]
      - [31.840, 34.632]
    intake_box_basis: derived
    intake_box_reasoning: >-
      From the 2009 environmental summary (design basis): plant ~2,700 m east of the shoreline,
      intake heads ~1,450 m west of the coastline, at 15 m depth, three heads >=50 m apart. With
      the OSM plant point and a N-S shoreline, the intake lies near 31.8496 N, 34.644 E. Box is
      +-1.1 km north-south and +-1.1 km east-west around it. Design-basis numbers, not as-built.
    intake_depth_m: 15
    intake_distance_m: 1450
    pretreatment: UF
    capacity: "100 MCM/yr"
    status: operating
    sentinels: [port_said, el_arish, rafah]
    notes: >-
      Pretreatment: the 2009 design document selected sand filters on cost grounds; the Israel
      Desalination Society page (operating plant, since 2015) describes UF. UF recorded.
    sources:
      name: https://ildesal.org.il/ashdod-desalination-plant/
      sea: https://ildesal.org.il/ashdod-desalination-plant/
      onshore: https://www.openstreetmap.org/way/555185946
      intake_box:
