# plants.yaml — public registry of Israeli seawater desalination plants + upstream sentinels.
#
# HARD RULE: public sources only. Every non-null plant field has a public URL under that
# plant's `sources:` map. A field with no public source is `null`, never guessed.
# Validate with:  python3 scripts/check_registry.py plants.yaml
#
# SCHEMA
#   plants.<id>:
#     name               display name
#     sea                mediterranean | red_sea
#     onshore            {lat, lon}  plant location (WGS84, decimal degrees)
#     intake_box         closed polygon, list of [lat, lon] points (first == last), around the
#                        intake head; this is the area the satellite statistics are taken over
#     intake_box_basis   published | derived | estimated
#                          published  = coordinates of the intake head are public
#                          derived    = computed from published distances + a public coordinate
#                          estimated  = stated-size box seaward of the plant, reasoning in
#                                       intake_box_reasoning (intake location not public)
#     intake_box_reasoning  free text, required when basis is `estimated`/`derived`
#     intake_depth_m     depth of the intake head, metres
#     intake_distance_m  distance of the intake head from shore, metres
#     pretreatment       DAF | UF | MMF   (MMF = multi-media/dual-media gravity filtration)
#     capacity           free text as stated by the source, with unit
#     status             operating | under_construction | ...
#     sentinels          ids from `sentinels:` that are upstream early-warning points
#     notes              free text (conflicting sources, caveats)
#     sources            map: field name -> public URL (or list of URLs)
#
#   sentinels.<id>: name, sea, location {lat, lon}, box (closed polygon), box_basis, sources.
#     Sentinels are not plants: location + box + source only.
#
# LOCAL OVERRIDE
#   Put private or corrected values in `plants.local.yaml` next to this file (same schema,
#   same ids; any field you set replaces the public one). It is in .gitignore and is never
#   committed. The public registry holds public-source facts only.
#
# Coordinates: WGS84 [lat, lon]. OSM = OpenStreetMap (ODbL). Data pulled 2026-10-01.

plants:

  hadera:
    name: Hadera
    sea: mediterranean
    onshore: {lat: 32.47074, lon: 34.89048}
    intake_box:
      - [32.455, 34.855]
      - [32.455, 34.880]
      - [32.485, 34.880]
      - [32.485, 34.855]
      - [32.455, 34.855]
    intake_box_basis: estimated
    intake_box_reasoning: >-
      Intake-head coordinates are not published. Onshore point is the centre of the Orot Rabin
      power-station site (OSM), which IDE gives as the plant location. IDE states three 1.8 m
      pipes 1.25 km long; the pipe contractor states 1500 m from the beach. Box spans 1.0-3.3 km
      west of the onshore point, ~3.3 km north-south, to cover both figures. ~2.3 x 3.3 km.
    intake_depth_m: 18
    intake_distance_m: 1250
    pretreatment: MMF
    capacity: "137 MCM/yr (max potential 160 MCM/yr)"
    status: operating
    sentinels: [port_said, el_arish, rafah]
    notes: >-
      Distance conflict between sources (1250 m IDE vs 1500 m contractor). Depth 18 m is from
      the pipe contractor only. Commissioned 2009, operation from Jan 2010 (IDE).
    sources:
      name: https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf
      sea: https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf
      onshore:
        - https://www.openstreetmap.org/way/24694956
        - https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf
      intake_box:
        - https://www.openstreetmap.org/way/24694956
        - https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf
        - https://www.merterre.com/hadera-desalination-plant/
      intake_depth_m: https://www.merterre.com/hadera-desalination-plant/
      intake_distance_m: https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf
      pretreatment: https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf
      capacity: https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf
      status: https://ide-tech.com/wp-content/uploads/2023/01/IDE-Hadera_Project.pdf

