  eilat:
    name: Eilat seawater desalination (Mekorot)
    sea: red_sea
    onshore: null
    intake_box:
      - [29.480, 34.940]
      - [29.480, 34.980]
      - [29.530, 34.980]
      - [29.530, 34.940]
      - [29.480, 34.940]
    intake_box_basis: estimated
    intake_box_reasoning: >-
      Public pages give no plant coordinate or intake location. Box is sea-only water at the
      head of the Gulf of Aqaba east of the Port of Eilat (OSM), ~3.9 x 5.6 km, kept off the
      coast to avoid land-adjacent pixels. 3 of 4 CoralTemp pixels in it were valid sea on
      2026-09-28.
    intake_depth_m: null
    intake_distance_m: null
    pretreatment: null
    capacity: "approx. 55,000 m3/day water supply (as stated by source)"
    status: operating
    sentinels: [tiran, gulf_mid]
    notes: >-
      Operating since 1997; desalinates a mix of seawater and brackish-plant brine (source).
      The 55,000 m3/day figure is the stated supply, not necessarily seawater-RO output.
    sources:
